name: "CI - Test Features"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.gen-filters.outputs.features }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-path-filters
        id: gen-filters

      - name: "Write detected features summary"
        env:
          FEATURES: ${{ steps.gen-filters.outputs.features }}
        run: |
          {
            echo "## Detected features for testing"
            echo
            if [ -z "$FEATURES" ] || [ "$FEATURES" = "[]" ]; then
              echo "No feature changes were detected for this workflow run."
            else
              count=$(echo "$FEATURES" | jq 'length')
              echo "Detected ${count} feature(s):"
              echo
              echo "| Feature |"
              echo "|---|"
              echo "$FEATURES" | jq -r '.[] | "| `" + . + "` |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-autogenerated:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' against ubuntu"
        run: devcontainer features test --project-folder . --skip-scenarios --skip-duplicated -f "${{ matrix.features }}" -i "mcr.microsoft.com/devcontainers/base:ubuntu"

  test-duplicate:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' duplicate against ubuntu"
        run: devcontainer features test --project-folder . --skip-scenarios --skip-autogenerated -f "${{ matrix.features }}" -i "mcr.microsoft.com/devcontainers/base:ubuntu"

  test-scenarios:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        run: devcontainer features test --project-folder . -f "${{ matrix.features }}" --skip-autogenerated --skip-duplicated
