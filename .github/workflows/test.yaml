name: "CI - Test Features"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.gen-filters.outputs.features }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-path-filters
        id: gen-filters

  test-autogenerated:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' against ubuntu"
        run: devcontainer features test --skip-scenarios -f "${{ matrix.features }}" -i "mcr.microsoft.com/devcontainers/base:ubuntu" .

  test-scenarios:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f "${{ matrix.features }}" --skip-autogenerated --skip-duplicated .
