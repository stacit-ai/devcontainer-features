name: "CI - Test Features(Multi-OS)"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.result.outputs.features }}
    steps:
      - uses: actions/checkout@v4

      - name: "Detect changed features (push/PR)"
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/generate-path-filters
        id: changed

      - name: "List all features (workflow_dispatch)"
        id: all
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          shopt -s nullglob
          features=()
          for dir in src/*/; do
            features+=("$(basename "$dir")")
          done
          if [ ${#features[@]} -eq 0 ]; then
            echo "features=[]" >> "$GITHUB_OUTPUT"
          else
            echo "features=$(printf '%s\n' "${features[@]}" | jq -Rc . | jq -sc .)" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: "Combine feature outputs"
        id: result
        env:
          CHANGED_FEATURES: ${{ steps.changed.outputs.features }}
          ALL_FEATURES: ${{ steps.all.outputs.features }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "features=$ALL_FEATURES" >> "$GITHUB_OUTPUT"
          else
            echo "features=$CHANGED_FEATURES" >> "$GITHUB_OUTPUT"
          fi

      - name: "Write detected features summary"
        env:
          FEATURES: ${{ steps.result.outputs.features }}
        run: |
          {
            echo "## Detected features for testing"
            echo
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Manual run: all features are selected."
            else
              echo "Changed-feature run: selected features are based on path filters."
            fi
            echo
            if [ -z "$FEATURES" ] || [ "$FEATURES" = "[]" ]; then
              echo "No feature changes were detected for this workflow run."
            else
              count=$(echo "$FEATURES" | jq 'length')
              echo "Detected ${count} feature(s):"
              echo
              echo "| Feature |"
              echo "|---|"
              echo "$FEATURES" | jq -r '.[] | "| `" + . + "` |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-test-matrix
        id: build
        with:
          features: ${{ needs.changes.outputs.features }}

      - name: "Write multi-OS test matrix summary"
        env:
          MATRIX: ${{ steps.build.outputs.matrix }}
        run: |
          {
            echo "## Multi-OS feature test matrix"
            echo
            count=$(echo "$MATRIX" | jq '.include | length')
            echo "Generated ${count} feature/image combination(s):"
            echo
            echo "| Feature | Base image |"
            echo "|---|---|"
            echo "$MATRIX" | jq -r \
              '.include[] | "| `" + .features + "` | `" + .baseImage + "` |"'
          } >> "$GITHUB_STEP_SUMMARY"

  test-autogenerated:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f "${{ matrix.features }}" -i "${{ matrix.baseImage }}" .

  test-scenarios:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f "${{ matrix.features }}" --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
