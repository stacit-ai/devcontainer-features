name: "Generate Path Filters"
description: >
  Scan src/ for feature directories and run dorny/paths-filter to detect
  which features changed. Caller must run actions/checkout@v4 first.
outputs:
  features:
    description: "JSON array of changed feature names"
    value: ${{ steps.filter.outputs.changes }}
runs:
  using: composite
  steps:
    - name: Generate path filters file
      id: gen-filters
      shell: bash
      run: |
        shopt -s nullglob
        filters_file="$RUNNER_TEMP/filters.yml"
        for dir in src/*/; do
          name=$(basename "$dir")
          printf '%s:\n  - "src/%s/**"\n  - "test/%s/**"\n' \
            "$name" "$name" "$name"
        done > "$filters_file"
        echo "path=${filters_file}" >> "$GITHUB_OUTPUT"

    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: ${{ steps.gen-filters.outputs.path }}
